version: '3.8'

services:
  db:
    image: postgres:15
    container_name: theatre_db
    environment:
      - POSTGRES_DB=theatredb
      - POSTGRES_USER=admin_theatre
      - POSTGRES_PASSWORD=password123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: