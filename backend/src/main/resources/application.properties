# Nombre de la aplicación
spring.application.name=the-theatre-backend

# --- Conexión a Base de Datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/theatredb
spring.datasource.username=admin_theatre
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración de JPA / Hibernate ---
# IMPORTANTE: Lo cambio a 'update' para que NO borre tus usuarios al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CONFIGURACIÓN JWT ---
# Clave Hexadecimal fuerte (256 bits) para evitar errores de firma
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Tiempo de expiración: 24 horas
application.security.jwt.expiration=86400000