# Nombre de la aplicacion
spring.application.name=the-theatre-backend

# --- Conexion a Base de Datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/theatredb
spring.datasource.username=admin_theatre
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuracion de JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- CONFIGURACION JWT (NUEVO) ---
application.security.jwt.secret-key=bWljbGF2ZXN1cGVyc2VjcmV0YXlsYXJnYXBhcmFxdWVqd3RmdW5jaW9uZTIwMjQ=
# Tiempo de expiracion: 86400000 ms = 24 horas
application.security.jwt.expiration=86400000

# NIVEL DE LOGGING AL MAXIMO PARA SEGURIDAD
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE